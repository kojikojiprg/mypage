<svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="320" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A0E17" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#6EE7B7" stop-opacity="0.16" />
      <stop offset="1" stop-color="#6EE7B7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="320" height="200" fill="url(#bg)" />
  <rect x="0" y="0" width="320" height="200" fill="url(#glow)" />

  <!-- transformer layer bands -->
  <rect x="24" y="26" width="272" height="18" rx="2" fill="none" stroke="#1E293B" stroke-width="1" />
  <rect x="24" y="26" width="118" height="18" rx="2" fill="#6EE7B7" fill-opacity="0.10" stroke="#6EE7B7" stroke-opacity="0.35" stroke-width="1" />

  <rect x="24" y="156" width="272" height="18" rx="2" fill="none" stroke="#1E293B" stroke-width="1" />
  <rect x="178" y="156" width="118" height="18" rx="2" fill="#6EE7B7" fill-opacity="0.10" stroke="#6EE7B7" stroke-opacity="0.35" stroke-width="1" />

  <!-- attention connections between two node rows -->
  <g stroke="#6EE7B7" stroke-width="1">
    <line x1="56" y1="70" x2="88" y2="130" stroke-opacity="0.55" />
    <line x1="56" y1="70" x2="140" y2="130" stroke-opacity="0.18" />
    <line x1="56" y1="70" x2="192" y2="130" stroke-opacity="0.08" />

    <line x1="108" y1="70" x2="88" y2="130" stroke-opacity="0.15" />
    <line x1="108" y1="70" x2="140" y2="130" stroke-opacity="0.5" />
    <line x1="108" y1="70" x2="244" y2="130" stroke-opacity="0.1" />

    <line x1="160" y1="70" x2="140" y2="130" stroke-opacity="0.12" />
    <line x1="160" y1="70" x2="192" y2="130" stroke-opacity="0.42" />
    <line x1="160" y1="70" x2="244" y2="130" stroke-opacity="0.22" />

    <line x1="212" y1="70" x2="192" y2="130" stroke-opacity="0.1" />
    <line x1="212" y1="70" x2="244" y2="130" stroke-opacity="0.5" />
    <line x1="212" y1="70" x2="264" y2="130" stroke-opacity="0.2" />

    <line x1="264" y1="70" x2="244" y2="130" stroke-opacity="0.16" />
    <line x1="264" y1="70" x2="264" y2="130" stroke-opacity="0.55" />
  </g>

  <!-- upper node row -->
  <g fill="#6EE7B7">
    <circle cx="56" cy="70" r="4" fill-opacity="0.9" />
    <circle cx="108" cy="70" r="4" fill-opacity="0.9" />
    <circle cx="160" cy="70" r="4" fill-opacity="0.9" />
    <circle cx="212" cy="70" r="4" fill-opacity="0.9" />
    <circle cx="264" cy="70" r="4" fill-opacity="0.9" />
  </g>

  <!-- lower node row -->
  <g fill="#6EE7B7">
    <circle cx="88" cy="130" r="4" fill-opacity="0.55" />
    <circle cx="140" cy="130" r="4" fill-opacity="0.55" />
    <circle cx="192" cy="130" r="4" fill-opacity="0.55" />
    <circle cx="244" cy="130" r="4" fill-opacity="0.55" />
    <circle cx="264" cy="130" r="4" fill-opacity="0.55" />
  </g>

  <!-- attention matrix grid, bottom-right corner -->
  <g stroke="#1E293B" stroke-width="0.75">
    <rect x="242" y="18" width="60" height="42" fill="none" />
    <line x1="254" y1="18" x2="254" y2="60" />
    <line x1="266" y1="18" x2="266" y2="60" />
    <line x1="278" y1="18" x2="278" y2="60" />
    <line x1="290" y1="18" x2="290" y2="60" />
    <line x1="242" y1="28" x2="302" y2="28" />
    <line x1="242" y1="39" x2="302" y2="39" />
    <line x1="242" y1="49" x2="302" y2="49" />
  </g>
  <g fill="#6EE7B7">
    <rect x="242" y="18" width="12" height="10" fill-opacity="0.6" />
    <rect x="266" y="28" width="12" height="11" fill-opacity="0.85" />
    <rect x="278" y="39" width="12" height="10" fill-opacity="0.35" />
    <rect x="290" y="49" width="12" height="11" fill-opacity="0.5" />
  </g>
</svg>
