<svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="320" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A0E17" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.36" r="0.75">
      <stop offset="0" stop-color="#6EE7B7" stop-opacity="0.16" />
      <stop offset="1" stop-color="#6EE7B7" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0E17" stop-opacity="0" />
      <stop offset="1" stop-color="#0A0E17" stop-opacity="0.92" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="320" height="200" fill="url(#bg)" />
  <rect x="0" y="0" width="320" height="200" fill="url(#glow)" />

  <!-- transformer layer bands -->
  <rect x="24" y="16" width="272" height="16" rx="2" fill="none" stroke="#1E293B" stroke-width="1" />
  <rect x="24" y="16" width="118" height="16" rx="2" fill="#6EE7B7" fill-opacity="0.10" stroke="#6EE7B7" stroke-opacity="0.35" stroke-width="1" />

  <!-- attention connections between two node rows -->
  <g stroke="#6EE7B7" stroke-width="1">
    <line x1="56" y1="56" x2="88" y2="108" stroke-opacity="0.55" />
    <line x1="56" y1="56" x2="140" y2="108" stroke-opacity="0.18" />
    <line x1="56" y1="56" x2="192" y2="108" stroke-opacity="0.08" />

    <line x1="108" y1="56" x2="88" y2="108" stroke-opacity="0.15" />
    <line x1="108" y1="56" x2="140" y2="108" stroke-opacity="0.5" />
    <line x1="108" y1="56" x2="244" y2="108" stroke-opacity="0.1" />

    <line x1="160" y1="56" x2="140" y2="108" stroke-opacity="0.12" />
    <line x1="160" y1="56" x2="192" y2="108" stroke-opacity="0.42" />
    <line x1="160" y1="56" x2="244" y2="108" stroke-opacity="0.22" />

    <line x1="212" y1="56" x2="192" y2="108" stroke-opacity="0.1" />
    <line x1="212" y1="56" x2="244" y2="108" stroke-opacity="0.5" />
    <line x1="212" y1="56" x2="264" y2="108" stroke-opacity="0.2" />

    <line x1="264" y1="56" x2="244" y2="108" stroke-opacity="0.16" />
    <line x1="264" y1="56" x2="264" y2="108" stroke-opacity="0.55" />
  </g>

  <!-- upper node row -->
  <g fill="#6EE7B7">
    <circle cx="56" cy="56" r="4" fill-opacity="0.9" />
    <circle cx="108" cy="56" r="4" fill-opacity="0.9" />
    <circle cx="160" cy="56" r="4" fill-opacity="0.9" />
    <circle cx="212" cy="56" r="4" fill-opacity="0.9" />
    <circle cx="264" cy="56" r="4" fill-opacity="0.9" />
  </g>

  <!-- lower node row -->
  <g fill="#6EE7B7">
    <circle cx="88" cy="108" r="4" fill-opacity="0.55" />
    <circle cx="140" cy="108" r="4" fill-opacity="0.55" />
    <circle cx="192" cy="108" r="4" fill-opacity="0.55" />
    <circle cx="244" cy="108" r="4" fill-opacity="0.55" />
    <circle cx="264" cy="108" r="4" fill-opacity="0.55" />
  </g>

  <!-- attention matrix grid, top-right corner -->
  <g stroke="#1E293B" stroke-width="0.75">
    <rect x="242" y="12" width="60" height="42" fill="none" />
    <line x1="254" y1="12" x2="254" y2="54" />
    <line x1="266" y1="12" x2="266" y2="54" />
    <line x1="278" y1="12" x2="278" y2="54" />
    <line x1="290" y1="12" x2="290" y2="54" />
    <line x1="242" y1="22" x2="302" y2="22" />
    <line x1="242" y1="33" x2="302" y2="33" />
    <line x1="242" y1="43" x2="302" y2="43" />
  </g>
  <g fill="#6EE7B7">
    <rect x="242" y="12" width="12" height="10" fill-opacity="0.6" />
    <rect x="266" y="22" width="12" height="11" fill-opacity="0.85" />
    <rect x="278" y="33" width="12" height="10" fill-opacity="0.35" />
    <rect x="290" y="43" width="12" height="11" fill-opacity="0.5" />
  </g>

  <!-- bottom scrim for text legibility -->
  <rect x="0" y="128" width="320" height="72" fill="url(#scrim)" />

  <!-- wordmark -->
  <text x="24" y="172" font-family="'DM Mono', monospace" font-size="20" font-weight="500" fill="#6EE7B7" letter-spacing="0.5">AI Theories</text>
  <line x1="24" y1="182" x2="140" y2="182" stroke="#6EE7B7" stroke-opacity="0.4" stroke-width="1" />
</svg>
